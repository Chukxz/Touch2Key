<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <linearGradient id="key-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33394F"/>
      <stop offset="100%" stop-color="#212638"/>
    </linearGradient>

    <!-- Neon glow. userSpaceOnUse so small shapes aren't clipped; used only inside the ripple group (local origin = ripple center). -->
    <filter id="neon" filterUnits="userSpaceOnUse" x="-150" y="-150" width="300" height="300">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="glow3"/>
      <feMerge>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow-key" filterUnits="userSpaceOnUse" x="-60" y="-60" width="360" height="400">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="shadow-cursor" filterUnits="userSpaceOnUse" x="-40" y="-40" width="160" height="170">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg-grad)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#252A3A" stroke-width="4"/>

  <!-- Artwork scaled 1.3x around canvas center -->
  <g transform="translate(256 240) scale(1.3) translate(-256 -240)">

    <!-- Keycap -->
    <g filter="url(#shadow-key)" transform="translate(136, 140)">
      <rect x="0" y="20" width="240" height="230" rx="30" fill="#1A1F30" stroke="#2B3248" stroke-width="2"/>
      <rect x="20" y="10" width="200" height="190" rx="20" fill="url(#key-surface)" stroke="#454D66" stroke-width="2"/>
    </g>

    <!-- Touch ripple: thicker strokes, 3 segments per ring so it survives small sizes -->
    <g transform="translate(256, 240)">
      <circle cx="0" cy="0" r="14" fill="#00E5FF" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00E5FF" stroke-width="7" stroke-linecap="round" stroke-dasharray="52 21" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="100 36" opacity="0.9" filter="url(#neon)"/>
    </g>

    <!-- Cursor -->
    <g transform="translate(265, 255) rotate(-10)" filter="url(#shadow-cursor)">
      <path d="M 0 0 L 20 55 L 28 38 L 50 55 L 58 45 L 35 28 L 55 20 Z" fill="#FFFFFF" stroke="#00E5FF" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
